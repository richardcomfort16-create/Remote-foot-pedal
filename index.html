<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMX Controller</title>
<link rel="stylesheet" href="style.css">
<style>
body {
  background: #111;
  color: white;
  font-family: Arial;
  margin: 0;
  padding: 20px;
  text-align: center;
}
button {
  width: 90%;
  padding: 18px;
  margin: 8px 0;
  font-size: 20px;
  border: none;
  border-radius: 10px;
  background: #333;
  color: white;
}
.color-box {
  width: 80px;
  height: 80px;
  border-radius: 10px;
  margin: 10px auto;
  border: 2px solid white;
}
.row {
  display: flex;
  justify-content: space-around;
  margin-top: 10px;
}
input[type=color] {
  width: 100%;
  height: 60px;
  border: none;
  padding: 0;
}
</style>
</head>

<body>

<h2>DMX Controller</h2>

<h3>Fades</h3>
<button onclick="send('/api/fade1')">Fade 1</button>
<button onclick="send('/api/fade2')">Fade 2</button>
<button onclick="send('/api/fade3')">Fade 3</button>

<h3>Snaps</h3>
<button onclick="send('/api/snap1')">Snap 1</button>
<button onclick="send('/api/snap2')">Snap 2</button>
<button onclick="send('/api/snap3')">Snap 3</button>

<h3>Upbeats</h3>
<button onclick="send('/api/upbeat1')">Upbeat 1</button>
<button onclick="send('/api/upbeat2')">Upbeat 2</button>
<button onclick="send('/api/upbeat3')">Upbeat 3</button>

<h3>Tap Tempo</h3>
<button onclick="send('/api/tap')">Tap</button>

<h3>Fade Time</h3>
<input type="range" min="1" max="25" value="4" oninput="setFadeTime(this.value)">
<p id="fadeLabel">4 seconds</p>

<h3>PAR Colours</h3>
<div class="row">
  <div>
    <p>PAR 1</p>
    <input type="color" onchange="setPar(0,this.value)">
  </div>
  <div>
    <p>PAR 2</p>
    <input type="color" onchange="setPar(1,this.value)">
  </div>
</div>

<div class="row">
  <div>
    <p>PAR 3</p>
    <input type="color" onchange="setPar(2,this.value)">
  </div>
  <div>
    <p>PAR 4</p>
    <input type="color" onchange="setPar(3,this.value)">
  </div>
</div>

<h3>All PARs</h3>
<input type="color" onchange="setAllPars(this.value)">

<h3>Moving Head Colour</h3>
<input type="color" onchange="setHead(this.value)">

<h3>Pan / Tilt</h3>
<input type="range" min="0" max="255" value="127" oninput="setPan(this.value)">
<p>Pan</p>
<input type="range" min="0" max="255" value="127" oninput="setTilt(this.value)">
<p>Tilt</p>

<h3>Overrides</h3>
<button onclick="send('/api/whiteOverride?on=1')">White ON</button>
<button onclick="send('/api/whiteOverride?on=0')">White OFF</button>

<button onclick="send('/api/blackout?on=1')">Blackout ON</button>
<button onclick="send('/api/blackout?on=0')">Blackout OFF</button>

<h3>Pedal Mode</h3>
<button onclick="send('/api/pedalMode')">Return to Pedal</button>

<script src="script.js"></script>
</body>
</html>
